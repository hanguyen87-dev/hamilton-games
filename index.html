<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="theme-color" content="#FFB703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Time">
<title>Hamilton's Game Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root { --bg: #FFF8EC; --surface: #FFFFFF; --line: #F0DFC0; --ink: #2B2118; --muted: #7A6A58; --brand: #F77F00; --brand-ink: #FFFFFF; --sun: #FFB703; --sky: #1D8FB0; --sky-soft: #E2F3F8;
  --good: #23864A; --good-bg: #E1F5E7; --bad: #CF3E36; --bad-bg: #FCE7E5; --map: #E8DCC8; --map-line: #FFFFFF; --hl: #F77F00; --shadow: 0 6px 0 #EBD9B8;
  --f: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --sky: #5CC8E0; --sky-soft: #193037;
  --good: #63D48D; --good-bg: #15301F; --bad: #FF8178; --bad-bg: #3B1C1A; --map: #54493B; --map-line: #272019; --hl: #FFA436; --shadow: 0 6px 0 #0F0C09; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --sky: #5CC8E0; --sky-soft: #193037;
  --good: #63D48D; --good-bg: #15301F; --bad: #FF8178; --bad-bg: #3B1C1A; --map: #54493B; --map-line: #272019; --hl: #FFA436; --shadow: 0 6px 0 #0F0C09; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 18px/1.4 var(--f); min-height: 100vh; -webkit-tap-highlight-color: transparent;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; cursor: pointer; }
main { max-width: 640px; margin: 0 auto; }
h1, h2 { font-weight: 800; line-height: 1.1; margin: 0; }

/* top bar */
.top { max-width: 640px; margin: 0 auto 12px; display: flex; align-items: center; gap: 8px; min-height: 52px; }
.top .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.icon { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 1.4rem; display: grid; place-items: center; padding: 0; flex: none; }
.icon:active { transform: translateY(2px); }

/* home */
.hello { display: flex; align-items: center; gap: 14px; margin: 6px 0 16px; }
.hello h1 { font-size: clamp(2rem, 8vw, 2.6rem); }
.hello p { margin: 2px 0 0; color: var(--muted); font-size: 1.1rem; }
.wave { font-size: 2.6rem; display: inline-block; animation: wave 2.4s ease-in-out 1; transform-origin: 70% 80%; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
.today { width: 100%; text-align: left; border: 0; border-radius: 24px; padding: 20px 22px; background: var(--sun); color: #2B2118; box-shadow: 0 7px 0 #D99A00; display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.today:active { transform: translateY(4px); box-shadow: 0 3px 0 #D99A00; }
.today .big { font-size: 3rem; line-height: 1; }
.today b { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.today span { font-size: 1.05rem; }
.today.done { background: var(--good-bg); color: var(--ink); box-shadow: 0 7px 0 var(--line); }
h2 { font-size: 1.3rem; margin: 0 0 10px; }
.rows { display: grid; gap: 12px; margin-bottom: 26px; }
.row { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); }
.row:active { transform: translateY(4px); box-shadow: none; }
.row .ico { font-size: 2.3rem; width: 52px; text-align: center; flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row b { display: block; font-size: 1.3rem; font-weight: 800; line-height: 1.15; }
.row small { color: var(--muted); font-size: .98rem; }
.lv { flex: none; font-size: .9rem; color: var(--muted); text-align: right; line-height: 1.1; }
.lv i { font-style: normal; color: var(--sun); letter-spacing: -1px; display: block; font-size: 1rem; }
.note { background: var(--sky-soft); border-radius: 16px; padding: 12px 16px; margin: -12px 0 24px; font-size: 1.02rem; }

/* play */
.playbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dots { flex: 1; display: flex; justify-content: center; gap: 8px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--sun); }
.dots i.ok { background: var(--good); }
.dots i.cur { outline: 3px solid var(--brand); outline-offset: 2px; }
.prompt { font-size: clamp(1.6rem, 6.5vw, 2.1rem); font-weight: 800; text-align: center; margin: 4px 0 10px; line-height: 1.15; text-wrap: balance; }
.pic { display: grid; place-items: center; margin: 0 auto 14px; min-height: 60px; }
.choices { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.choices.n3 { grid-template-columns: 1fr 1fr 1fr; }
.choices.wide { grid-template-columns: 1fr; }
.ch { position: relative; min-height: 76px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: clamp(1.35rem, 5.5vw, 1.8rem); font-weight: 800; padding: 10px 12px; display: grid; place-items: center; line-height: 1.1; text-align: center; }
.ch:active { transform: translateY(4px); box-shadow: none; }
.ch.txt { padding-right: 44px; }
.ch .spk { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; background: var(--sky-soft); }
.ch.pic-ch { font-size: 3.4rem; }
.ch.flag { font-size: clamp(3.4rem, 15vw, 4.6rem); line-height: 1; }
.ch.no { background: var(--bad-bg); border-color: var(--bad); opacity: .55; box-shadow: none; animation: shake .4s; }
.ch.yes { background: var(--good-bg); border-color: var(--good); box-shadow: none; animation: pop .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes pop { 50% { transform: scale(1.08); } }
.msg { min-height: 2.2em; text-align: center; font-size: 1.3rem; font-weight: 800; margin: 14px 0 6px; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
.next { display: block; width: 100%; border: 0; border-radius: 22px; padding: 16px; font-size: 1.6rem; font-weight: 800; background: var(--good); color: #fff; box-shadow: 0 6px 0 #17643A; }
.next:active { transform: translateY(4px); box-shadow: none; }
.grownup-play { text-align: center; color: var(--muted); font-size: .95rem; margin: 0 0 8px; }

/* pictures */
.grp { display: grid; grid-template-columns: repeat(5, 1.15em); justify-content: center; gap: .1em .15em; font-size: clamp(2.1rem, 9vw, 2.8rem); line-height: 1.15; }
.grp.few { grid-template-columns: repeat(var(--n), 1.15em); }
.grp .gone { opacity: .25; filter: grayscale(1); }
.two { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.two .grp { font-size: clamp(1.7rem, 7vw, 2.3rem); }
.plus { font-size: 2.4rem; font-weight: 800; color: var(--brand); }
.eq { font-size: clamp(2.6rem, 12vw, 3.6rem); font-weight: 800; letter-spacing: .04em; }
.eq u { text-decoration: none; display: inline-block; min-width: 1.1em; border-bottom: 5px solid var(--brand); color: var(--brand); }
.nline { display: flex; gap: 10px; justify-content: center; }
.nline b { width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 2.2rem; background: var(--surface); border: 3px solid var(--line); }
.nline b.q { border-color: var(--brand); color: var(--brand); border-style: dashed; }
.coins { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 460px; }
.coin { display: block; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25)); }
.clock { width: min(62vw, 250px); height: auto; }
.ch .clock { width: 100%; max-width: 120px; }
.digital { font-size: 3.4rem; font-weight: 800; letter-spacing: .04em; background: #1E1E24; color: #7CFFA1; border-radius: 16px; padding: 4px 22px; font-variant-numeric: tabular-nums; }
.map { width: 100%; height: auto; display: block; }
.map path { fill: var(--map); stroke: var(--map-line); stroke-width: 1.3; stroke-linejoin: round; }
.map .land { fill: var(--map); opacity: .7; }
.map path.hl { fill: var(--hl); }
.map path.miss { fill: var(--bad); }
.map.tap path[data-i] { cursor: pointer; }
.map .ring { fill: none; stroke: var(--hl); stroke-width: 4; }
.mapbox { width: 100%; border-radius: 20px; background: var(--sky-soft); padding: 8px; }
.shape path { fill: var(--hl); stroke: none; }
.bigtext { font-size: 4.2rem; font-weight: 800; letter-spacing: .1em; color: var(--brand); }
.flagbig { font-size: clamp(6rem, 30vw, 8.5rem); line-height: 1.05; }

/* reading */
.ch.letter { font-size: clamp(2.8rem, 13vw, 3.6rem); }
.ch.wordch { font-size: clamp(1.9rem, 8.5vw, 2.5rem); letter-spacing: .04em; }
.bigsnd { font-size: 2.4rem; border: 0; background: var(--sky-soft); border-radius: 24px; padding: 12px 30px; }
.word { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.tile { font: inherit; font-size: clamp(2.3rem, 11vw, 2.9rem); font-weight: 800; min-width: 68px; height: 82px; padding: 0 10px; border-radius: 16px; border: 3px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.tile.q { border-style: dashed; border-color: var(--brand); color: var(--brand); }
.tile.on { background: var(--sun); color: #2B2118; }
.picword { display: grid; justify-items: center; gap: 6px; }
.sent { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin: 6px 0 22px; }
.wd { font: inherit; font-size: clamp(2rem, 9vw, 2.8rem); font-weight: 800; border: 0; background: none; padding: 0 6px; border-radius: 12px; color: var(--ink); }
.wd.on { background: var(--sun); color: #2B2118; }
.page-pic { font-size: clamp(4rem, 22vw, 6.5rem); text-align: center; line-height: 1.15; margin: 8px 0 4px; word-break: break-all; }
.storynav { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.storytitle { text-align: center; color: var(--muted); margin: 0; font-size: 1.05rem; }

/* done */
.done { text-align: center; padding-top: 20px; }
.done .star { font-size: 7rem; display: inline-block; animation: spin 1.2s ease-out; }
@keyframes spin { from { transform: scale(.2) rotate(-200deg); } to { transform: scale(1) rotate(0); } }
.done h1 { font-size: 2.4rem; margin: 6px 0; }
.done p { font-size: 1.3rem; margin: 4px 0 18px; }
.done .row { justify-content: center; }
.btns { display: grid; gap: 12px; }
.btn { border: 0; border-radius: 20px; padding: 14px 18px; font-size: 1.35rem; font-weight: 800; background: var(--brand); color: var(--brand-ink); box-shadow: 0 6px 0 #B85F00; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.soft { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }

/* rewards */
.bal { text-align: center; margin: 4px 0 18px; }
.bal b { font-size: 3.4rem; font-weight: 800; display: block; line-height: 1; }
.how { display: grid; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-bottom: 24px; font-size: 1.02rem; }
.shop .row { cursor: default; }
.shop .row:active { transform: none; box-shadow: var(--shadow); }
.price { font-weight: 800; white-space: nowrap; }
.mini { border: 0; border-radius: 14px; padding: 8px 14px; font-weight: 800; background: var(--brand); color: var(--brand-ink); font-size: 1rem; white-space: nowrap; }
.mini.soft { background: var(--surface); border: 2px solid var(--line); color: var(--ink); }
.mini:disabled { background: var(--line); color: var(--muted); cursor: default; }
.tag { font-size: .9rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good); }
.cal { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.cal span { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: .85rem; background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.cal span.on { background: var(--sun); border-color: var(--sun); color: #2B2118; font-weight: 800; }
.cal span.fz { border: 2px dashed var(--sky); color: var(--sky); }

/* grown-ups */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; font-size: 1rem; }
.panel h2 { font-size: 1.2rem; }
.panel p { margin: 0 0 10px; color: var(--muted); }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.li .grow { flex: 1; min-width: 140px; }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.form label { display: grid; gap: 2px; font-size: .9rem; font-weight: 700; }
.form input { font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: .98rem; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.banner { background: var(--sky-soft); color: var(--ink); border-radius: 14px; padding: 8px 14px; margin: 0 auto 12px; max-width: 640px; font-size: .98rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* modal, toast, confetti */
.modal { position: fixed; inset: 0; background: rgba(20, 14, 8, .5); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal > div { background: var(--surface); border-radius: 24px; padding: 24px; max-width: 380px; width: 100%; text-align: center; display: grid; gap: 14px; }
.modal .em { font-size: 4rem; line-height: 1; }
.modal h2 { font-size: 1.6rem; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-size: 1rem; z-index: 30; max-width: 90vw; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
.loading { text-align: center; padding: 80px 0; font-size: 1.4rem; color: var(--muted); }
</style>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header class="top" id="top" hidden>
  <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
  <div class="grow"></div>
  <span class="chip" id="starChip" title="Stars">⭐ 0</span>
  <span class="chip" id="streakChip" title="Days in a row">🔥 0</span>
  <button class="icon" id="soundBtn" aria-label="Sound on">🔊</button>
</header>
<main id="app"><p class="loading">Loading… 🚀</p></main>
<script>
"use strict";
// ---------- settings ----------
const KID = "Hamilton", PARENT_NAME = "Papa";
const ROUND = 5;                 // questions per round and in Today's 5
const PRACTICE_PER_STAR = 10;    // right on the first try in games (not Today's 5), per day
const STREAK_EVERY = 5, STREAK_BONUS = 3;  // +3 stars every 5 days in a row
const GAMES = [
  { id: "sounds", ico: "🔤", name: "Letter Sounds", sub: "Sounds, blending, reading" },
  { id: "count", ico: "🍎", name: "Counting", sub: "Count things, more and less" },
  { id: "add", ico: "➕", name: "Adding", sub: "Put together and take away" },
  { id: "coins", ico: "🪙", name: "Coins", sub: "Penny, nickel, dime, quarter" },
  { id: "clock", ico: "⏰", name: "Clock", sub: "Tell the time" },
  { id: "states", ico: "🗺️", name: "50 States", sub: "Find states and capitals" },
  { id: "flags", ico: "🚩", name: "Flags", sub: "Flags of the world" },
  { id: "countries", ico: "🌍", name: "Countries", sub: "Countries, continents, capitals" },
];
// Must match SHOP_COST in api/db.js.
const SHOP = [
  { id: "sticker", em: "🌟", name: "A sticker", stars: 3 },
  { id: "story", em: "📖", name: "Pick the bedtime story", stars: 5 },
  { id: "icecream", em: "🍦", name: "Ice cream", stars: 8 },
  { id: "park", em: "🛝", name: "Trip to the park", stars: 10 },
  { id: "movie", em: "🍿", name: "Movie night", stars: 12 },
  { id: "pancakes", em: "🥞", name: "Pancake breakfast", stars: 15 },
  { id: "toy", em: "🧸", name: "A small toy", stars: 25 },
  { id: "zoo", em: "🦁", name: "Trip to the zoo", stars: 40 },
  { id: "bigtoy", em: "🎁", name: "A big toy", stars: 60 },
];
const PRAISE = ["Great job, " + KID + "!", "You got it!", "Awesome!", "Super smart!", "Yes! That's right!", "Wow, nice!", "High five!"];
const OOPS = ["Oops! Try again.", "Almost! Try another one.", "Not that one. Try again!"];

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = (n) => String(n).padStart(2, "0");
const dayOf = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDay = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const listOf = (s) => s.length < 2 ? s.join("") : s.slice(0, -1).join(", ") + ", or " + s[s.length - 1];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Number choices: the answer plus nearby numbers, smallest first.
function numChoices(ans, n, lo, hi, steps = [1, 2, 3]) {
  const set = new Set([ans]);
  for (const s of shuffle(steps.flatMap((x) => [x, -x]))) { if (set.size >= n) break; const v = ans + s; if (v >= lo && v <= hi) set.add(v); }
  for (let v = lo; set.size < n && v <= hi; v++) set.add(v);
  return [...set].sort((a, b) => a - b);
}
// Other items for wrong choices; near = closest ones first (harder).
function others(list, target, n, near) {
  let pool = list.filter((x) => x !== target);
  if (near) pool = pool.sort((a, b) => Math.hypot(a.c[0] - target.c[0], a.c[1] - target.c[1]) - Math.hypot(b.c[0] - target.c[0], b.c[1] - target.c[1])).slice(0, n + 2);
  return shuffle(pool).slice(0, n);
}

// ---------- state + saving ----------
const S = { role: "student", space: "his", data: {}, view: "home", round: null, sound: true, api: true };
const PARENT_WRITES = new Set(["grants", "freezes", "redemptions"]);
try { S.sound = localStorage.getItem("hgt-sound") !== "off"; } catch { /* storage blocked */ }
const LOCAL = new Set(["localhost", "127.0.0.1", ""]);

async function load() {
  let r;

const COIN = { p: { name: "penny", v: 1, mm: 19.05, c: ["#E29A62", "#9C5428"], txt: "1¢" }, n: { name: "nickel", v: 5, mm: 21.2, c: ["#E9EBEE", "#9BA1A9"], txt: "5¢" },
  d: { name: "dime", v: 10, mm: 17.9, c: ["#F2F3F5", "#A4AAB2"], txt: "10¢", reed: 1 }, q: { name: "quarter", v: 25, mm: 24.3, c: ["#EEF0F2", "#9EA4AC"], txt: "25¢", reed: 1 } };
const cents = (v) => v === 1 ? "1 cent" : v + " cents";
const sum = (list) => list.reduce((s, k) => s + COIN[k].v, 0);
// A handful of coins for counting, biggest first, kept to totals right for the level.
function coinSet(lv) {
  const max = [10, 15, 30, 50, 100][lv - 1], kinds = lv <= 3 ? ["d", "n", "p"] : ["q", "d", "n", "p"];
  for (;;) {
    const list = [];
    const n = rnd(2, lv >= 5 ? 6 : 5);
    for (let i = 0; i < n; i++) list.push(pick(kinds));
    list.sort((a, b) => COIN[b].v - COIN[a].v);
    if (sum(list) <= max) return list;
  }
}
function coinSvg(k, label, scale = 1) {
  const c = COIN[k], r = 50, size = Math.round(c.mm * 3.1 * scale), id = "g" + k + uid();
  const rim = c.reed ? `<circle cx="50" cy="50" r="47.5" fill="none" stroke="${c.c[1]}" stroke-width="4" stroke-dasharray="1.6 1.6"/>` : `<circle cx="50" cy="50" r="47" fill="none" stroke="${c.c[1]}" stroke-width="3"/>`;
  const face = label ? `<text x="50" y="${c.txt.length > 2 ? 60 : 61}" text-anchor="middle" font-family="Baloo 2, system-ui, sans-serif" font-weight="800" font-size="${c.txt.length > 2 ? 30 : 34}" fill="${k === "p" ? "#5A2C0E" : "#4A4F57"}">${c.txt}</text>`
    : `<circle cx="50" cy="44" r="13" fill="${c.c[1]}" opacity=".45"/><path d="M28 78 Q50 52 72 78" fill="${c.c[1]}" opacity=".45"/>`;
  return `<svg class="coin" width="${size}" height="${size}" viewBox="0 0 100 100" aria-label="${c.name}"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="${c.c[0]}"/><stop offset="1" stop-color="${c.c[1]}"/></radialGradient></defs><circle cx="50" cy="50" r="${r - 1}" fill="url(#${id})"/>${rim}<circle cx="50" cy="50" r="38" fill="none" stroke="${c.c[1]}" stroke-width="1.2" opacity=".7"/>${face}</svg>`;
}
const coinsPic = (list, label, scale = 1) => `<div class="coins">${list.map((k) => coinSvg(k, label, scale)).join("")}</div>`;
function clockSvg(h, m) {
  const colors = ["#E63973", "#F77F00", "#E0A800", "#23864A", "#1D8FB0", "#8E5CF0"];
  let s = `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="A clock"><circle cx="100" cy="100" r="94" fill="#FFFFFF" stroke="#2B2118" stroke-width="7"/>`;
  for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 84 : 80; s += `<line x1="${100 + Math.sin(a) * r1}" y1="${100 - Math.cos(a) * r1}" x2="${100 + Math.sin(a) * 88}" y2="${100 - Math.cos(a) * 88}" stroke="#2B2118" stroke-width="${i % 5 ? 1.2 : 3}"/>`; }
  for (let i = 1; i <= 12; i++) { const a = i * 30 * Math.PI / 180; s += `<text x="${100 + Math.sin(a) * 68}" y="${100 - Math.cos(a) * 68 + 8.5}" text-anchor="middle" font-family="Baloo 2, system-ui, sans-serif" font-weight="800" font-size="24" fill="${colors[i % 6]}">${i}</text>`; }
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  s += `<line x1="100" y1="100" x2="100" y2="62" stroke="#E63946" stroke-width="10" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>`;
  s += `<line x1="100" y1="100" x2="100" y2="45" stroke="#1D6FD8" stroke-width="6" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>`;
  return s + `<circle cx="100" cy="100" r="8" fill="#2B2118"/></svg>`;
}

// ---------- rounds ----------
async function startRound(mode) {
  const games = mode === "today" ? shuffle(GAMES.map((g) => g.id)).slice(0, ROUND) : Array(ROUND).fill(mode);
  S.round = { mode, games, i: 0, results: [], seen: new Set(), before: tally().earned };
  S.view = "play";
  await nextQuestion();
}
async function nextQuestion() {
  const r = S.round, g = r.games[r.i];
  try { await ensureData(g); } catch { toast("The map didn’t load. Check the internet."); S.view = "home"; render(); return; }
  const lv = levelOf(g);
  let q;
  for (let k = 0; k < 15; k++) { q = GEN[g](lv); if (!r.seen.has(q.key)) break; }
  r.seen.add(q.key);
  Object.assign(q, { g, lv });
  Object.assign(r, { q, tries: 0, solved: false });
  render();
  if (q.clips) speak(q.clips, 150); else say(q.say, 150);
}
function choose(key, el) {
  const r = S.round, q = r && r.q;
  if (!q || r.solved) return;
  r.tries++;
  const msg = $(".msg");
  if (key === q.answer) {
    r.solved = true;
    const first = r.tries === 1;
    r.results.push(first);
    if (el) el.classList.add("yes");
    if (q.tap) $(`.map path[data-i="${q.answer}"]`).classList.add("hl");
    const praise = pick(PRAISE);
    msg.className = "msg good"; msg.textContent = `${praise} ${q.after || ""}`;
    sfx.good(); confetti();
    if (q.clips) speak([lineItem("p-" + PRAISE.indexOf(praise), praise), ...(q.afterClips || [])], 380);
    else say(`${praise} ${q.after || ""}`, 380, "praise");
    put("answers", uid(), { g: q.g, d: dayOf(), ok: first, lv: q.lv, t: Date.now(), ...(r.mode === "today" ? { dl: 1 } : {}) });
    const next = $("#nextBtn");
    next.hidden = false;
    next.textContent = r.i + 1 < r.games.length ? "Next ▶" : "Finish 🎉";
    next.focus({ preventScroll: true });
    renderDots();
  } else {
    if (q.tap) {
      const p = $(`.map path[data-i="${key}"]`);
      if (p) { p.classList.add("miss"); setTimeout(() => p.classList.remove("miss"), 900); }
      const oops = `That's ${q.tapName(+key)}. Try again!`;
      msg.className = "msg bad"; msg.textContent = oops;
      sfx.bad(); say(oops, 250, "oops");
      return;
    }
    if (el) { el.classList.add("no"); el.disabled = true; }
    const oops = pick(OOPS);
    msg.className = "msg bad"; msg.textContent = oops;
    sfx.bad();
    if (q.clips) speak([lineItem("o-" + OOPS.indexOf(oops), oops)], 250); else say(oops, 250, "oops");
  }
}
function advance() {
  const r = S.round;
  if (r.i + 1 < r.games.length) { r.i++; nextQuestion(); return; }
  finishRound();
}
function finishRound() {
  const r = S.round, right = r.results.filter(Boolean).length, today = dayOf();
  let firstToday = false;
  if (r.mode === "today" && !(S.data.days || {})[today]) { put("days", today, { d: today, n: right, t: Date.now() }); firstToday = true; }
  const after = tally();
  r.summary = { right, firstToday, gained: after.earned - r.before, streak: after.streak };
  S.view = "done";
  render();
  sfx.win(); confetti(60);
  say(`You did it, ${KID}! You got ${right} right on the first try.${r.summary.gained ? ` You earned ${plural(r.summary.gained, "star", "stars")}!` : ""}`, 600);
}

function render() {

  $("#starChip").textContent = `⭐ ${t.balance}`;
  $("#streakChip").textContent = `🔥 ${t.streak}`;
  $("#soundBtn").textContent = S.sound ? "🔊" : "🔇";
  $("#soundBtn").setAttribute("aria-label", S.sound ? "Sound on" : "Sound off");
  $("#homeBtn").style.visibility = S.view === "home" ? "hidden" : "visible";
  const b = $("#banner");
  b.hidden = !(S.role !== "student" || S.space === "test" || S.space === "local");
  b.innerHTML = S.space === "test" ? "🧪 <b>Test mode</b>: separate practice data." : S.role === "parent" ? `👋 Grown-up view: you see ${KID}'s stars. Games you play here aren't saved.` : S.space === "local" ? "💻 Preview on this computer: progress stays in this browser." : "";
  const app = $("#app");
  if (S.view === "play") app.innerHTML = playView();
  else if (S.view === "done") app.innerHTML = doneView(t);
  else if (S.view === "rewards") app.innerHTML = rewardsView(t);
  else if (S.view === "grownups") app.innerHTML = grownupsView(t);
  else if (S.view === "voices") app.innerHTML = voicesView();
  else if (S.view === "stories") app.innerHTML = storiesView();
  else if (S.view === "story") app.innerHTML = storyView();
  else app.innerHTML = homeView(t);
  if (S.view === "play") renderDots();

}

  const freezes = Object.entries(S.data.freezes || {}).filter(([, f]) => !f.removed).sort((a, b) => b[1].from.localeCompare(a[1].from));
  return `<div class="panel"><h2>Prize requests</h2>
    ${open.length ? `<div class="list">${open.map(([id, x]) => { const it = SHOP.find((s) => s.id === x.item) || { em: "🎁", name: x.item }; return `<div class="li"><span class="grow">${it.em} <b>${esc(it.name)}</b> · ${x.stars} ⭐ · ${new Date(x.t).toLocaleDateString()}</span><button class="mini" data-give="${esc(id)}">Given ✓</button><button class="mini soft" data-cancel="${esc(id)}">Cancel</button></div>`; }).join("")}</div>` : `<p>No requests right now.</p>`}
  </div>
  <div class="panel"><h2>${KID}'s games</h2><p>Level moves up at 80% right on the first try and down at 40%. Stars: ${t.earned} earned, ${t.spent} spent. Streak ${t.streak} days.</p>
    <table><tr><th>Game</th><th class="n">Level</th><th class="n">This week</th><th class="n">All</th><th class="n">Last 20</th></tr>${rows}</table></div>
  <div class="panel"><h2>Give special stars</h2><p>For being kind, trying hard, or anything you like. He sees your reason.</p>
    <form class="form" id="grantForm"><label>Stars<input name="stars" type="number" min="1" max="500" value="2" style="width:80px" required></label><label style="flex:1">Reason<input name="reason" maxlength="200" placeholder="Great listening today" required></label><button class="mini">Give</button></form></div>
  <div class="panel"><h2>Freeze the streak</h2><p>For trips or sick days: these days won't break his streak.</p>
    <form class="form" id="freezeForm"><label>From<input name="from" type="date" required value="${dayOf()}"></label><label>To<input name="to" type="date" required value="${dayOf()}"></label><label style="flex:1">Reason<input name="reason" maxlength="120" placeholder="Trip"></label><button class="mini">Freeze</button></form>
    ${freezes.length ? `<div class="list" style="margin-top:10px">${freezes.map(([id, f]) => `<div class="li"><span class="grow">❄️ ${f.from} to ${f.to}${f.reason ? " · " + esc(f.reason) : ""}</span><button class="mini soft" data-unfreeze="${esc(id)}">Remove</button></div>`).join("")}</div>` : ""}</div>
  ${reqs.length > open.length ? `<div class="panel"><h2>Past prizes</h2><div class="list">${reqs.filter(([, x]) => x.status !== "requested").slice(0, 15).map(([, x]) => { const it = SHOP.find((s) => s.id === x.item) || { em: "🎁", name: x.item }; return `<div class="li"><span class="grow">${it.em} ${esc(it.name)} · ${x.stars} ⭐</span><span class="tag${x.status === "delivered" ? " good" : ""}">${x.status === "delivered" ? "Given" : "Cancelled"}</span></div>`; }).join("")}</div></div>` : ""}
  ${voicePanel()}
  <div class="panel"><h2>This device</h2><div class="form">${S.space === "test" ? `<button class="mini soft" data-act="cleartest">Clear test data</button>` : ""}<button class="mini soft" data-act="logout">Log out</button></div></div>`;
}

// ---------- events ----------
function modal(html, onYes) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div role="dialog" aria-modal="true">${html}<div class="btns"><button class="btn" data-m="yes">Yes!</button><button class="btn soft" data-m="no">Not now</button></div></div>`;
  m.addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (!b && e.target !== m) return; m.remove(); if (b && b.dataset.m === "yes") onYes(); });
  document.body.append(m);
}
document.addEventListener("click", async (e) => {
  const spk = e.target.closest("[data-say]");
  if (spk) { e.stopPropagation(); say(spk.dataset.say); return; }
  const go = e.target.closest("[data-go]");
  if (go) {
    const v = go.dataset.go;
    if (v === "stories") {
      try { await ensureData("stories"); } catch { toast("The stories didn’t load. Check the internet."); return; }
      S.view = "stories"; S.round = null; render(); return;
    }
    if (v === "home" || v === "rewards" || v === "grownups" || v === "voices") { S.view = v; S.round = null; render(); if (v === "rewards") say(`You have ${plural(tally().balance, "star", "stars")}!`); return; }
    startRound(v);
    return;
  }
  const story = e.target.closest("[data-story]");
  if (story) { S.story = { id: story.dataset.story, page: 0 }; S.view = "story"; render(); const st = R().stories.find((x) => x.id === S.story.id); speak([lineItem(`t-${st.id}-title`, st.title)]); return; }
  const sp = e.target.closest("[data-sp]");
  if (sp) {
    const st = R().stories.find((x) => x.id === S.story.id);
    S.story.page = Math.max(0, +sp.dataset.sp); render();
    if (S.story.page >= st.pages.length) { sfx.win(); confetti(50); speak([rq("end")], 300); }
    return;
  }
  const wd = e.target.closest("[data-w]");
  if (wd) { document.querySelectorAll(".wd.on").forEach((x) => x.classList.remove("on")); wd.classList.add("on"); speak(soundOut(wd.dataset.w)); return; }
  const tile = e.target.closest("[data-snd]");
  if (tile) { tile.classList.add("on"); setTimeout(() => tile.classList.remove("on"), 600); speak([sndItem(tile.dataset.snd)]); return; }
  const ch = e.target.closest(".ch");
  if (ch && S.view === "play") { choose(ch.dataset.k, ch); return; }
  const path = e.target.closest(".map.tap path[data-i]");
  if (path && S.view === "play" && S.round.q.tap) { choose(path.dataset.i, null); return; }
  if (e.target.closest("#nextBtn")) { advance(); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "repeat") { if (S.round.q.clips) speak(S.round.q.clips); else say(S.round.q.say); }
    if (a === "readpage") { const st = R().stories.find((x) => x.id === S.story.id), i = S.story.page; speak([lineItem(`t-${st.id}-${i}`, st.pages[i][0])]); }
    if (a === "soundout") speak(S.round.q.sounds.map((g) => sndItem(g.k, 0.45)));
    if (a === "quit") { if (S.round.mode === "today" && S.round.results.length) modal(`<span class="em">🛑</span><h2>Stop Today's 5?</h2>`, () => { S.view = "home"; S.round = null; render(); }); else { S.view = "home"; S.round = null; render(); } }
    if (a === "logout") modal(`<span class="em">👋</span><h2>Log out?</h2>`, async () => { await fetch("/api/logout", { method: "POST" }).catch(() => {}); location.href = "/login"; });
    if (a === "cleartest") modal(`<span class="em">🧪</span><h2>Clear all test data?</h2>`, async () => { await fetch("/api/db", { method: "DELETE" }); location.reload(); });
    return;
  }
  const vb = e.target.closest("[data-vplay],[data-vuse],[data-vstyle],[data-vread]");
  if (vb) {
    if (vb.dataset.vread && Object.hasOwn(READ_SETS, vb.dataset.vread)) {
      vPref.read = vb.dataset.vread; saveVoice(); render();
      loadClipIndex().then(() => speak([{ id: "p-0", text: `Great job, ${KID}!`, gap: 0.4 }, { id: "t-sam-2", text: "Sam sat on a mat." }], 0, true));
      return;
    }
    if (vb.dataset.vstyle && Object.hasOwn(STYLES, vb.dataset.vstyle)) { vPref.style = vb.dataset.vstyle; saveVoice(); render(); say(SAMPLE, 0, "praise", true); return; }
    const v = voices.find((x) => x.voiceURI === (vb.dataset.vplay || vb.dataset.vuse));
    if (!v) return;
    if (vb.dataset.vuse) { vPref.uri = v.voiceURI; saveVoice(); pickVoice(); render(); }
    const keep = voice;
    voice = v; say(SAMPLE, 0, "praise", true); voice = keep;
    return;
  }
  const buy = e.target.closest("[data-buy]");
  if (buy) {
    const it = SHOP.find((s) => s.id === buy.dataset.buy);
    say(`Ask ${PARENT_NAME} for ${it.name}? It costs ${it.stars} stars.`);
    modal(`<span class="em">${it.em}</span><h2>Ask ${PARENT_NAME} for ${it.name}?</h2><p>It costs ${it.stars} ⭐</p>`, async () => {
      if (tally().balance < it.stars) return;
      if (await putNow("redemptions", "r-" + uid(), { item: it.id, stars: it.stars, status: "requested", t: Date.now() })) { sfx.win(); confetti(); say(`Yay! ${PARENT_NAME} will get it for you.`); render(); }
    });
    return;
  }
  const give = e.target.closest("[data-give],[data-cancel]");
  if (give) {
    const id = give.dataset.give || give.dataset.cancel, x = S.data.redemptions[id];
    if (await putNow("redemptions", id, { ...x, status: give.dataset.give ? "delivered" : "cancelled", done: Date.now() })) render();
    return;
  }
  const uf = e.target.closest("[data-unfreeze]");
  if (uf && await putNow("freezes", uf.dataset.unfreeze, { ...S.data.freezes[uf.dataset.unfreeze], removed: true })) render();
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "grantForm") {
    if (await putNow("grants", "g-" + uid(), { stars: Math.round(+f.get("stars")), reason: String(f.get("reason")).trim(), t: Date.now() })) { toast("Stars given ⭐"); render(); }
  }
  if (e.target.id === "freezeForm") {
    const from = f.get("from"), to = f.get("to");
    if (to < from) { toast("The end date is before the start."); return; }
    if (await putNow("freezes", "f-" + uid(), { from, to, reason: String(f.get("reason") || "").trim(), t: Date.now() })) { toast("Streak frozen ❄️"); render(); }
  }
});
$("#homeBtn").addEventListener("click", () => {
  if (S.view === "play" && S.round.mode === "today" && S.round.results.length) { modal(`<span class="em">🛑</span><h2>Stop Today's 5?</h2>`, () => { S.view = "home"; S.round = null; render(); }); return; }
  S.view = "home"; S.round = null; render();
});
$("#soundBtn").addEventListener("click", () => {
  S.sound = !S.sound;
  try { localStorage.setItem("hgt-sound", S.sound ? "on" : "off"); } catch { /* storage blocked */ }
  if (!S.sound && "speechSynthesis" in window) speechSynthesis.cancel();
  render();
  if (S.view === "play" && S.round) { /* keep the question on screen */ }
});
// Pick up changes from the other phone (prize given, stars from Papa) when the app comes back, between rounds only.
let lastLoad = Date.now();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || S.view === "play" || !S.api || Date.now() - lastLoad < 60000 || queue.length) return;
  try { const j = await load(); S.data = j.data; lastLoad = Date.now(); render(); } catch { /* keep what we have */ }
});

(async function boot() {
  try {
    const j = await load();
    Object.assign(S, { role: j.role, space: j.space, data: j.data || {} });
    for (const c of ["answers", "days", "redemptions", "grants", "freezes"]) S.data[c] ||= {};
    render();
    loadClipIndex();
    if (S.api) { ensureData("states").catch(() => {}); ensureData("countries").catch(() => {}); ensureData("sounds").catch(() => {}); }
  } catch {
    $("#app").innerHTML = `<p class="loading">Couldn’t connect. 📡<br><button class="btn" onclick="location.reload()">Try again</button></p>`;
  }
})();
</script>
</body>
</html>
