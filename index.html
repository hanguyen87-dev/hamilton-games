<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try { const t = localStorage.getItem("hgt-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch { /* storage blocked: follow the device */ }</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="theme-color" content="#FFB703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Time">
<title>Hamilton's Game Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
:root { --bg: #FFF8EC; --surface: #FFFFFF; --line: #F0DFC0; --ink: #2B2118; --muted: #7A6A58; --brand: #F77F00; --brand-ink: #FFFFFF; --sun: #FFB703; --sky: #1D8FB0; --sky-soft: #E2F3F8;
  --good: #23864A; --good-bg: #E1F5E7; --bad: #CF3E36; --bad-bg: #FCE7E5; --map: #E8DCC8; --map-line: #FFFFFF; --hl: #F77F00; --shadow: 0 6px 0 #EBD9B8;
  --f: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --sky: #5CC8E0; --sky-soft: #193037;
  --good: #63D48D; --good-bg: #15301F; --bad: #FF8178; --bad-bg: #3B1C1A; --map: #54493B; --map-line: #272019; --hl: #FFA436; --shadow: 0 6px 0 #0F0C09; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --sky: #5CC8E0; --sky-soft: #193037;
  --good: #63D48D; --good-bg: #15301F; --bad: #FF8178; --bad-bg: #3B1C1A; --map: #54493B; --map-line: #272019; --hl: #FFA436; --shadow: 0 6px 0 #0F0C09; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 18px/1.4 var(--f); min-height: 100vh; -webkit-tap-highlight-color: transparent;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
button { font: inherit; color: inherit; cursor: pointer; }
main { max-width: 640px; margin: 0 auto; }
h1, h2 { font-weight: 800; line-height: 1.1; margin: 0; }

/* top bar */
.top { max-width: 640px; margin: 0 auto 12px; display: flex; align-items: center; gap: 8px; min-height: 52px; }
.top .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.icon { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 1.4rem; display: grid; place-items: center; padding: 0; flex: none; }
.icon:active { transform: translateY(2px); }

/* home */
.hello { display: flex; align-items: center; gap: 14px; margin: 6px 0 16px; }
.hello h1 { font-size: clamp(2rem, 8vw, 2.6rem); }
.hello p { margin: 2px 0 0; color: var(--muted); font-size: 1.1rem; }
.wave { font-size: 2.6rem; display: inline-block; animation: wave 2.4s ease-in-out 1; transform-origin: 70% 80%; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
.today { width: 100%; text-align: left; border: 0; border-radius: 24px; padding: 20px 22px; background: var(--sun); color: #2B2118; box-shadow: 0 7px 0 #D99A00; display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.today:active { transform: translateY(4px); box-shadow: 0 3px 0 #D99A00; }
.today .big { font-size: 3rem; line-height: 1; }
.today b { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.today span { font-size: 1.05rem; }
.today.done { background: var(--good-bg); color: var(--ink); box-shadow: 0 7px 0 var(--line); }
h2 { font-size: 1.3rem; margin: 0 0 10px; }
.rows { display: grid; gap: 12px; margin-bottom: 26px; }
.row { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); }
.row:active { transform: translateY(4px); box-shadow: none; }
.row .ico { font-size: 2.3rem; width: 52px; text-align: center; flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row b { display: block; font-size: 1.3rem; font-weight: 800; line-height: 1.15; }
.row small { color: var(--muted); font-size: .98rem; }
.lv { flex: none; font-size: .9rem; color: var(--muted); text-align: right; line-height: 1.1; }
.lv i { font-style: normal; color: var(--sun); letter-spacing: -1px; display: block; font-size: 1rem; }
.note { background: var(--sky-soft); border-radius: 16px; padding: 12px 16px; margin: -12px 0 24px; font-size: 1.02rem; }

/* play */
.playbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dots { flex: 1; display: flex; justify-content: center; gap: 8px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--sun); }
.dots i.ok { background: var(--good); }
.dots i.cur { outline: 3px solid var(--brand); outline-offset: 2px; }
.dots.many { gap: 4px; flex-wrap: wrap; }
.dots.many i { width: 10px; height: 10px; }
.prompt { font-size: clamp(1.6rem, 6.5vw, 2.1rem); font-weight: 800; text-align: center; margin: 4px 0 10px; line-height: 1.15; text-wrap: balance; }
.pic { display: grid; place-items: center; margin: 0 auto 14px; min-height: 60px; }
.choices { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.choices.n3 { grid-template-columns: 1fr 1fr 1fr; }
.choices.wide { grid-template-columns: 1fr; }
.ch { position: relative; min-height: 76px; border-radius: 20px; border: 3px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: clamp(1.35rem, 5.5vw, 1.8rem); font-weight: 800; padding: 10px 12px; display: grid; place-items: center; line-height: 1.1; text-align: center; }
.ch:active { transform: translateY(4px); box-shadow: none; }
.ch.txt { padding-right: 44px; }
.ch .spk { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; background: var(--sky-soft); }
.ch.pic-ch { font-size: 3.4rem; }
.ch.flag { font-size: clamp(3.4rem, 15vw, 4.6rem); line-height: 1; }
.ch.no { background: var(--bad-bg); border-color: var(--bad); opacity: .55; box-shadow: none; animation: shake .4s; }
.ch.yes { background: var(--good-bg); border-color: var(--good); box-shadow: none; animation: pop .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes pop { 50% { transform: scale(1.08); } }
.msg { min-height: 2.2em; text-align: center; font-size: 1.3rem; font-weight: 800; margin: 14px 0 6px; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
.next { display: block; width: 100%; border: 0; border-radius: 22px; padding: 16px; font-size: 1.6rem; font-weight: 800; background: var(--good); color: #fff; box-shadow: 0 6px 0 #17643A; }
.next:active { transform: translateY(4px); box-shadow: none; }
.grownup-play { text-align: center; color: var(--muted); font-size: .95rem; margin: 0 0 8px; }

/* pictures */
.grp { display: grid; grid-template-columns: repeat(5, 1.15em); justify-content: center; gap: .1em .15em; font-size: clamp(2.1rem, 9vw, 2.8rem); line-height: 1.15; }
.grp.few { grid-template-columns: repeat(var(--n), 1.15em); }
.grp .gone { opacity: .25; filter: grayscale(1); }
.two { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.two .grp { font-size: clamp(1.7rem, 7vw, 2.3rem); }
.plus { font-size: 2.4rem; font-weight: 800; color: var(--brand); }
.eq { font-size: clamp(2.6rem, 12vw, 3.6rem); font-weight: 800; letter-spacing: .04em; }
.eq u { text-decoration: none; display: inline-block; min-width: 1.1em; border-bottom: 5px solid var(--brand); color: var(--brand); }
.nline { display: flex; gap: 10px; justify-content: center; }
.nline b { width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; font-size: 2.2rem; background: var(--surface); border: 3px solid var(--line); }
.nline b.q { border-color: var(--brand); color: var(--brand); border-style: dashed; }
.coins { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; max-width: 460px; }
.coin { display: block; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25)); }
.clock { width: min(62vw, 250px); height: auto; }
.ch .clock { width: 100%; max-width: 120px; }
.digital { font-size: 3.4rem; font-weight: 800; letter-spacing: .04em; background: #1E1E24; color: #7CFFA1; border-radius: 16px; padding: 4px 22px; font-variant-numeric: tabular-nums; }
.map { width: 100%; height: auto; display: block; }
.map path { fill: var(--map); stroke: var(--map-line); stroke-width: 1.3; stroke-linejoin: round; }
.map .land { fill: var(--map); opacity: .7; }
.map path.hl { fill: var(--hl); }
.map path.miss { fill: var(--bad); }
.map.tap path[data-i] { cursor: pointer; }
.map .ring { fill: none; stroke: var(--hl); stroke-width: 4; }
.mapbox { width: 100%; border-radius: 20px; background: var(--sky-soft); padding: 8px; }
.shape path { fill: var(--hl); stroke: none; }
.bigtext { font-size: 4.2rem; font-weight: 800; letter-spacing: .1em; color: var(--brand); }
.flagbig { font-size: clamp(6rem, 30vw, 8.5rem); line-height: 1.05; }

/* reading */
.ch.letter { font-size: clamp(2.8rem, 13vw, 3.6rem); }
.ch.wordch { font-size: clamp(1.9rem, 8.5vw, 2.5rem); letter-spacing: .04em; }
.bigsnd { font-size: 2.4rem; border: 0; background: var(--sky-soft); border-radius: 24px; padding: 12px 30px; }
.word { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.tile { font: inherit; font-size: clamp(2.3rem, 11vw, 2.9rem); font-weight: 800; min-width: 68px; height: 82px; padding: 0 10px; border-radius: 16px; border: 3px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.tile.q { border-style: dashed; border-color: var(--brand); color: var(--brand); }
.tile.on { background: var(--sun); color: #2B2118; }
.picword { display: grid; justify-items: center; gap: 6px; }
.sent { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin: 6px 0 22px; }
.wd { font: inherit; font-size: clamp(2rem, 9vw, 2.8rem); font-weight: 800; border: 0; background: none; padding: 0 6px; border-radius: 12px; color: var(--ink); }
.wd.on { background: var(--sun); color: #2B2118; }
.page-pic { font-size: clamp(4rem, 22vw, 6.5rem); text-align: center; line-height: 1.15; margin: 8px 0 4px; word-break: break-all; }
.storynav { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.storytitle { text-align: center; color: var(--muted); margin: 0; font-size: 1.05rem; }

/* done */
.done { text-align: center; padding-top: 20px; }
.done .star { font-size: 7rem; display: inline-block; animation: spin 1.2s ease-out; }
@keyframes spin { from { transform: scale(.2) rotate(-200deg); } to { transform: scale(1) rotate(0); } }
.done h1 { font-size: 2.4rem; margin: 6px 0; }
.done p { font-size: 1.3rem; margin: 4px 0 18px; }
.done .row { justify-content: center; }
.btns { display: grid; gap: 12px; }
.btn { border: 0; border-radius: 20px; padding: 14px 18px; font-size: 1.35rem; font-weight: 800; background: var(--brand); color: var(--brand-ink); box-shadow: 0 6px 0 #B85F00; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.soft { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }

/* rewards */
.bal { text-align: center; margin: 4px 0 18px; }
.bal b { font-size: 3.4rem; font-weight: 800; display: block; line-height: 1; }
.how { display: grid; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-bottom: 24px; font-size: 1.02rem; }
.shop .row { cursor: default; }
.shop .row:active { transform: none; box-shadow: var(--shadow); }
.price { font-weight: 800; white-space: nowrap; }
.mini { border: 0; border-radius: 14px; padding: 8px 14px; font-weight: 800; background: var(--brand); color: var(--brand-ink); font-size: 1rem; white-space: nowrap; }
.mini.soft { background: var(--surface); border: 2px solid var(--line); color: var(--ink); }
.mini:disabled { background: var(--line); color: var(--muted); cursor: default; }
.tag { font-size: .9rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good); }
.cal { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.cal span { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: .85rem; background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.cal span.on { background: var(--sun); border-color: var(--sun); color: #2B2118; font-weight: 800; }
.cal span.fz { border: 2px dashed var(--sky); color: var(--sky); }

/* grown-ups */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; font-size: 1rem; }
.panel h2 { font-size: 1.2rem; }
.panel p { margin: 0 0 10px; color: var(--muted); }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.li .grow { flex: 1; min-width: 140px; }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.form label { display: grid; gap: 2px; font-size: .9rem; font-weight: 700; }
.form input { font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: .98rem; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.banner { background: var(--sky-soft); color: var(--ink); border-radius: 14px; padding: 8px 14px; margin: 0 auto 12px; max-width: 640px; font-size: .98rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* modal, toast, confetti */
.modal { position: fixed; inset: 0; background: rgba(20, 14, 8, .5); display: grid; place-items: center; padding: 20px; z-index: 20; }
.modal > div { background: var(--surface); border-radius: 24px; padding: 24px; max-width: 380px; width: 100%; text-align: center; display: grid; gap: 14px; }
.modal .em { font-size: 4rem; line-height: 1; }
.modal h2 { font-size: 1.6rem; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 14px; font-size: 1rem; z-index: 30; max-width: 90vw; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
.loading { text-align: center; padding: 80px 0; font-size: 1.4rem; color: var(--muted); }
/* adventure map */
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: -8px 0 24px; }
.quick button { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 2px; font-weight: 800; font-size: clamp(.7rem, 3vw, .95rem); display: grid; justify-items: center; gap: 2px; min-width: 0; }
.quick button span { font-size: 2rem; line-height: 1.1; }
.quick button:active { transform: translateY(4px); box-shadow: none; }
.adv { position: relative; margin: 0 0 24px; border-radius: 28px; background: linear-gradient(180deg, var(--good-bg), var(--sky-soft) 35%, var(--bg) 60%, var(--good-bg) 85%, var(--sky-soft)); overflow: hidden; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trail path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.trail .road { stroke: var(--line); stroke-width: 22; }
.trail .dash { stroke: var(--surface); stroke-width: 4; stroke-dasharray: 2 14; }
.gband { position: absolute; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 800; padding: 6px 16px; border-radius: 999px; font-size: 1.05rem; white-space: nowrap; z-index: 2; }
.node { position: absolute; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--line); background: var(--surface); box-shadow: 0 6px 0 var(--line); display: grid; place-items: center; padding: 0; z-index: 2; }
.node .nem { font-size: 2.4rem; line-height: 1; }
.node > b { position: absolute; bottom: -8px; right: -8px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 1.05rem; display: grid; place-items: center; border: 3px solid var(--surface); }
.node .prog { position: absolute; top: -10px; left: -10px; font-style: normal; font-size: .8rem; font-weight: 800; background: var(--sky); color: #fff; border-radius: 999px; padding: 2px 7px; }
.node .me { position: absolute; top: -40px; font-size: 2.2rem; animation: hop 1.4s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.node.done { background: var(--sun); border-color: #D99A00; box-shadow: 0 6px 0 #D99A00; }
.node.done > b { background: var(--good); }
.node.cur { border-color: var(--brand); box-shadow: 0 6px 0 #B85F00, 0 0 0 6px rgba(247, 127, 0, .25); animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 6px 0 #B85F00, 0 0 0 12px rgba(247, 127, 0, .12); } }
.node.lock, .node.soon { filter: grayscale(1); opacity: .55; box-shadow: none; }
.node.soon { opacity: .4; }
.node:active { transform: translate(-50%, -46%); }
.nlabel { position: absolute; transform: translate(-50%, -50%); font-size: .82rem; font-weight: 800; color: var(--muted); max-width: 30%; text-align: center; line-height: 1.1; pointer-events: none; z-index: 1; }
.tnode { position: absolute; transform: translate(-50%, -50%); font-size: 3rem; line-height: 1; background: var(--surface); border: 3px dashed var(--line); border-radius: 50%; width: 76px; height: 76px; display: grid; place-items: center; padding: 0; filter: grayscale(1); opacity: .5; z-index: 2; }
.tnode.got { filter: none; opacity: 1; border: 3px solid var(--sun); box-shadow: 0 0 0 6px rgba(255, 183, 3, .3); animation: pop 1.2s ease-in-out infinite; }
/* level + lesson */
.lvhead { text-align: center; margin: 4px 0 18px; }
.lvhead .lvem { font-size: 4.6rem; line-height: 1.05; }
.lvhead h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); }
.lvhead p { color: var(--muted); margin: 4px 0 0; font-size: 1.1rem; }
.row.boss { background: var(--sun); border-color: #D99A00; box-shadow: 0 6px 0 #D99A00; color: #2B2118; margin-bottom: 26px; }
.row.boss small { color: #5A4A30; }
.slide { min-height: 42vh; display: grid; place-items: center; align-content: center; gap: 12px; margin: 6px 0; }
.slide .map { max-width: 100%; }
.cap { font-size: clamp(1.25rem, 5.4vw, 1.6rem); font-weight: 800; text-align: center; margin: 4px 0 16px; line-height: 1.25; text-wrap: balance; }
.btn.go { background: var(--good); box-shadow: 0 6px 0 #17643A; color: #fff; }
.tcount { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 420px; }
.tc { position: relative; font-size: clamp(2.6rem, 12vw, 3.3rem); background: var(--surface); border: 3px solid var(--line); border-radius: 18px; width: 1.5em; height: 1.5em; display: grid; place-items: center; padding: 0; line-height: 1; }
.tc.on { border-color: var(--good); background: var(--good-bg); }
.tc.on::after { content: attr(data-num); position: absolute; top: -12px; right: -12px; min-width: 32px; height: 32px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 1.1rem; font-weight: 800; display: grid; place-items: center; }

<main id="app"><p class="loading">Loading… 🚀</p></main>
<script>
"use strict";
// ---------- settings ----------
const KID = "Hamilton", PARENT_NAME = "Papa";
const ROUND = 5;                 // questions per round and in Today's 5
const STREAK_EVERY = 5;          // streak bonus every 5 days in a row (STREAK_STARS, with the other star amounts in the adventure section)
const GAMES = [
  { id: "sounds", ico: "🔤", name: "Letter Sounds", sub: "Sounds, blending, reading" },
  { id: "count", ico: "🍎", name: "Counting", sub: "Count things, more and less" },
  { id: "add", ico: "➕", name: "Adding", sub: "Put together and take away" },
  { id: "coins", ico: "🪙", name: "Coins", sub: "Penny, nickel, dime, quarter" },

  { id: "flags", ico: "🚩", name: "Flags", sub: "Flags of the world" },
  { id: "countries", ico: "🌍", name: "Countries", sub: "Countries, continents, capitals" },
  { id: "continents", ico: "🌎", name: "Continents", sub: "The 7 continents" },
  { id: "shapes", ico: "🔷", name: "Shapes", sub: "Shapes and sides" },

// Must match SHOP_COST in api/db.js.
const SHOP = [
  { id: "sticker", em: "🌟", name: "A sticker", stars: 30 },
  { id: "story", em: "📖", name: "Pick the bedtime story", stars: 50 },
  { id: "icecream", em: "🍦", name: "Ice cream", stars: 80 },
  { id: "park", em: "🛝", name: "Trip to the park", stars: 100 },
  { id: "movie", em: "🍿", name: "Movie night", stars: 120 },
  { id: "pancakes", em: "🥞", name: "Pancake breakfast", stars: 150 },
  { id: "toy", em: "🧸", name: "A small toy", stars: 250 },
  { id: "zoo", em: "🦁", name: "Trip to the zoo", stars: 400 },
  { id: "bigtoy", em: "🎁", name: "A big toy", stars: 600 },

const PRAISE = ["Great job, " + KID + "!", "You got it!", "Awesome!", "Super smart!", "Yes! That's right!", "Wow, nice!", "High five!"];
const OOPS = ["Oops! Try again.", "Almost! Try another one.", "Not that one. Try again!"];

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const dayOf = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDay = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const listOf = (s) => s.length < 2 ? s.join("") : s.slice(0, -1).join(", ") + ", or " + s[s.length - 1];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// Number choices: the answer plus nearby numbers, smallest first.
function numChoices(ans, n, lo, hi, steps = [1, 2, 3]) {
  const set = new Set([ans]);
  for (const s of shuffle(steps.flatMap((x) => [x, -x]))) { if (set.size >= n) break; const v = ans + s; if (v >= lo && v <= hi) set.add(v); }
  for (let v = lo; set.size < n && v <= hi; v++) set.add(v);
  return [...set].sort((a, b) => a - b);
}
// Other items for wrong choices; near = closest ones first (harder).
function others(list, target, n, near) {
  let pool = list.filter((x) => x !== target);
  if (near) pool = pool.sort((a, b) => Math.hypot(a.c[0] - target.c[0], a.c[1] - target.c[1]) - Math.hypot(b.c[0] - target.c[0], b.c[1] - target.c[1])).slice(0, n + 2);
  return shuffle(pool).slice(0, n);
}

// ---------- state + saving ----------
const S = { role: "student", space: "his", data: {}, view: "home", round: null, sound: true, api: true, level: 1, lesson: null, topic: null, ctx: null };
const PARENT_WRITES = new Set(["grants", "freezes", "redemptions"]);
try { S.sound = localStorage.getItem("hgt-sound") !== "off"; } catch { /* storage blocked */ }
const LOCAL = new Set(["localhost", "127.0.0.1", ""]);

async function load() {
  let r;
  try { r = await fetch("/api/db", { cache: "no-store", credentials: "same-origin" }); }
  catch { if (LOCAL.has(location.hostname)) return localLoad(); throw new Error("offline"); }
  if (r.status === 401) { location.href = "/login"; return new Promise(() => {}); }
  if (r.status === 404 && LOCAL.has(location.hostname)) return localLoad();
  if (!r.ok) throw new Error("load " + r.status);
  return r.json();
}
// Preview on a computer without the server: progress stays in this browser. ?as=parent shows the grown-up view.
function localLoad() {
  S.api = false;
  let data = {};
  try { data = JSON.parse(localStorage.getItem("hgt-local") || "{}"); } catch { data = {}; }
  return { role: new URLSearchParams(location.search).get("as") === "parent" ? "parent" : "student", space: "local", data };
}
// Answers wait here and go to the server together (end of a round, app hidden, 8 waiting, or after a minute):
// the free storage plan allows 2,000 writes a month for all the family's apps, so each answer can't be its own write.
const queue = [];
const BATCHED = new Set(["answers", "days", "lessons", "cards"]), BATCH_MAX = 60;
let flushing = false, flushTimer = null;
function put(c, id, doc) {
  (S.data[c] ||= {})[id] = doc;
  if (S.role === "parent" && !PARENT_WRITES.has(c)) return;  // grown-up play isn't saved
  if (!S.api) { try { localStorage.setItem("hgt-local", JSON.stringify(S.data)); } catch { /* full */ } return; }
  queue.push({ c, id, doc });
  if (!BATCHED.has(c) || queue.length >= 8) flush();

}
async function flush() {
  clearTimeout(flushTimer); flushTimer = null;
  if (flushing) return;
  flushing = true;
  while (queue.length) {
    let n = 0;
    while (n < queue.length && n < BATCH_MAX && BATCHED.has(queue[n].c)) n++;
    const part = queue.slice(0, n || 1);
    try {
      const body = n ? { writes: part } : part[0];
      const r = await fetch("/api/db", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      if (r.status === 401) { location.href = "/login"; return; }
      if (r.status === 400 || r.status === 403 || r.status === 413) { const j = await r.json().catch(() => ({})); toast(j.error || "That couldn’t be saved."); queue.splice(0, part.length); continue; }
      if (!r.ok) throw new Error("save " + r.status);
      queue.splice(0, part.length);
    } catch {
      flushing = false;
      toast("Saving… check the internet.");
      setTimeout(flush, 5000);
      return;
    }
  }
  flushing = false;
}
// Leaving the app (home button, switching apps, closing): send what's waiting even if the page is closing.
function flushOnHide() {
  if (!queue.length || flushing || !S.api) return;
  const writes = queue.filter((x) => BATCHED.has(x.c)).slice(0, BATCH_MAX);
  if (writes.length !== queue.length) { flush(); return; }
  clearTimeout(flushTimer); flushTimer = null;
  fetch("/api/db", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ writes }), keepalive: true })
    .then((r) => { if (r.ok) queue.splice(0, writes.length); }).catch(() => {});
}
addEventListener("pagehide", flushOnHide);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushOnHide(); });
// Writes that must be accepted before the screen changes (reward requests, parent tools).
async function putNow(c, id, doc) {
  if (!S.api) { put(c, id, doc); return true; }
  try {
    const r = await fetch("/api/db", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ c, id, doc }) });
    if (r.status === 401) { location.href = "/login"; return false; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); toast(j.error || "That couldn’t be saved."); return false; }
    (S.data[c] ||= {})[id] = doc;
    return true;
  } catch { toast("No internet. Try again."); return false; }
}

// ---------- stars, streak, levels ----------
function frozenDays() {
  const out = new Set();
  for (const f of Object.values(S.data.freezes || {})) if (!f.removed) for (let d = f.from; d <= f.to; d = addDay(d, 1)) out.add(d);
  return out;
}
function tally() {
  const today = dayOf(), days = Object.values(S.data.days || {}), done = new Set(days.map((x) => x.d));
  // Generous on purpose: every right answer (first try) is a star, plus Today's 5, streaks, lessons, levels, and trophies.
  let earned = 0, perfect = 0, right = 0, rightToday = 0;
  for (const x of days) { earned += TODAY_STARS; if (x.n === ROUND) { earned += PERFECT_STARS; perfect++; } }
  for (const a of Object.values(S.data.answers || {})) if (a.ok) { right++; if (a.d === today) rightToday++; }
  earned += right * STAR_RIGHT;
  const adv = adventureStars();
  earned += adv.stars + cardStars();
  const frozen = frozenDays(), first = [...done].sort()[0];
  let streak = 0, bonus = 0;
  if (first) for (let d = first; d <= today; d = addDay(d, 1)) {
    if (done.has(d)) { streak++; if (streak % STREAK_EVERY === 0) bonus += STREAK_STARS; }
    else if (!frozen.has(d) && d !== today) streak = 0;  // today isn't over yet; frozen days don't count either way
  }
  earned += bonus;
  const grants = Object.values(S.data.grants || {}).reduce((s, g) => s + (g.stars || 0), 0);
  earned += grants;
  const spent = Object.values(S.data.redemptions || {}).filter((r) => r.status !== "cancelled").reduce((s, r) => s + (r.stars || 0), 0);
  return { earned, spent, balance: earned - spent, streak, bonus, right, rightToday, perfect, grants, adv, todayDone: done.has(today), frozen };
}
// Hidden level per game, 1 to 5, replayed from his answers: up at 80% right on the first try, down at 40% (last 10, at least 8 since the last change).
function levelOf(g) {
  const list = Object.values(S.data.answers || {}).filter((a) => a.g === g).sort((a, b) => a.t - b.t);
  let lv = 1, since = [];
  for (const a of list) {
    since.push(a.ok ? 1 : 0);
    if (since.length < 8) continue;
    const last = since.slice(-10), rate = last.reduce((s, x) => s + x, 0) / last.length;
    if (rate >= 0.8 && lv < 5) { lv++; since = []; } else if (rate <= 0.4 && lv > 1) { lv--; since = []; }
  }
  return lv;
}

// ---------- sound + speech ----------
let ac = null, voice = null, voices = [];
function tone(freqs, dur = 0.16, type = "triangle", gap = 0.09, vol = 0.18) {
  if (!S.sound) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();

      const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * gap;

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    });
  } catch { /* no audio */ }
}
const sfx = { good: () => tone([523, 659, 784]), bad: () => tone([247, 196], 0.2, "sine", 0.15, 0.12), win: () => tone([523, 659, 784, 1047, 784, 1047], 0.22, "triangle", 0.12) };
// Voice and style are chosen per device on the Voice page (Grown-ups); the best voice on the device is the default.
const STYLES = { cheerful: { name: "Cheerful", rate: 0.95, pitch: 1.2 }, calm: { name: "Calm", rate: 0.85, pitch: 1 }, story: { name: "Storyteller", rate: 0.88, pitch: 1.08 } };
const SAMPLE = `Great job, ${KID}! That's Texas. Its capital is Austin. Can you find Florida?`;
// Letter sounds and stories use recorded Google voices; each set is a folder in audio/ (made by tools/build_audio.mjs).
const READ_SETS = { warm: "Warm", bright: "Bright" };

const lessonStars = (doc) => !doc ? 0 : doc.n >= LESSON_Q ? 3 : doc.n >= LESSON_Q - 1 ? 2 : 1;
function levelDone(n, data = S.data) {
  const L = LEVELS[n - 1], ls = data.lessons || {};
  // Done by: the placement quiz, the level challenge, or every lesson (an Adventure lesson also counts when its library lessons are passed).
  return !!L && !!L.lessons && (n <= ((ls.place || {}).lv || 0) || !!(ls["c" + n] && ls["c" + n].pass) || L.lessons.every((x) => lsDone(x, data)));

// Stars from the Adventure (lessons, levels, trophies), counted from the saved lessons.
function adventureStars(data = S.data) {
  let lessons = 0, levels = 0, trophies = 0;
  for (const [id, d] of Object.entries(data.lessons || {})) if (d && id !== "place" && !/^c\d+$/.test(id)) lessons++;
  for (const L of LEVELS) if (levelDone(L.n, data)) levels++;
  for (const g of GRADES) {
    const all = LEVELS.filter((L) => L.n <= g.last && L.n > (GRADES[GRADES.indexOf(g) - 1]?.last || 0));
    if (all.every((L) => levelDone(L.n, data))) trophies += g.last === 20 ? CROWN_STARS : TROPHY_STARS;
  }
  return { lessons, levels, stars: lessons * LESSON_STARS + levels * LEVEL_STARS + trophies };
}

// 3 questions per level (math, reading, world), starting at Level 3. 2 of 3 right = that level is passed: go up; otherwise stop (or go down
// until a level is passed). Passed levels count as done in the Adventure. It only ever moves him up.
async function startPlacement() {
  S.round = { mode: "place", place: { L: 3, best: 0, down: false, blocks: 0 }, games: [], i: 0, results: [], seen: new Set(), before: tally().earned };
  S.view = "play";
  await placeBlock();

async function placeBlock() {
  const r = S.round, L = LEVELS[r.place.L - 1];
  try { await Promise.all(L.lessons.map(needData)); } catch { toast("That didn’t load. Check the internet."); S.view = "home"; render(); return; }
  const picks = ["math", "read", "world"].map((s) => pick(L.lessons.filter((x) => x.s === s))).filter(Boolean);
  while (picks.length < 3) picks.push(pick(L.lessons.filter((x) => !picks.includes(x))));
  r.games.push(...picks.map((x) => specOf(x.p)));
  r.i = r.games.length - picks.length;
  await nextQuestion();
}
function placeStep() {
  const r = S.round, p = r.place, ok = r.results.slice(-3).filter(Boolean).length >= 2, top = LEVELS.filter((L) => L.lessons).length;
  p.blocks++;
  if (ok) { p.best = Math.max(p.best, p.L); if (!p.down && p.L < top && p.blocks < 7) { p.L++; return placeBlock(); } return finishPlacement(); }
  if (p.best || p.L === 1 || p.blocks >= 7) return finishPlacement();
  p.down = true; p.L--;
  return placeBlock();
}
function finishPlacement() {
  const r = S.round, best = r.place.best, old = ((S.data.lessons || {}).place || {}).lv || 0;
  put("lessons", "place", { lv: Math.max(best, old), got: best, d: dayOf(), t: Date.now() });

  r.summary = { placed: Math.max(best, old), got: best, gained: tally().earned - r.before };
  S.view = "placed";
  render();
  tone([523, 659, 784, 1047, 1319], 0.18, "triangle", 0.11, 0.14); confetti(100);

}

// ---------- rounds ----------
async function startRound(mode) {
  const games = mode === "today" ? shuffle(GAMES.map((g) => g.id)).slice(0, ROUND) : Array(ROUND).fill(mode);
  S.round = { mode, games, i: 0, results: [], seen: new Set(), before: tally().earned };
  S.view = "play";
  await nextQuestion();
}
async function nextQuestion() {
  // A game is a name (free play: his hidden level) or a lesson spec { g, lv, only }.
  const r = S.round, spec = r.games[r.i], g = typeof spec === "string" ? spec : spec.g;
  try { await ensureData(g); } catch { toast("The map didn’t load. Check the internet."); S.view = "home"; render(); return; }
  const lv = typeof spec === "string" ? levelOf(g) : spec.lv;
  let q;
  for (let k = 0; k < 15; k++) { q = GEN[g](lv, spec.only, spec.opts || {}); if (!r.seen.has(q.key)) break; }
  r.seen.add(q.key);
  Object.assign(q, { g, lv });
  q.fact = factFor(g, q);
  Object.assign(r, { q, tries: 0, solved: false });
  render();
  if (q.clips) speak(q.clips, 150); else { say(q.say, 150); preload(`${q.after || ""} ${q.fact ? "Did you know? " + q.fact.fun : ""}`); }
}
function choose(key, el) {
  const r = S.round, q = r && r.q;

  r.tries++;
  const msg = $(".msg");
  if (key === q.answer) {
    r.solved = true;
    const first = r.tries === 1;
    r.results.push(first);
    if (el) el.classList.add("yes");
    if (q.tap) $(`.map path[data-i="${q.answer}"]`).classList.add("hl");
    const praise = pick(PRAISE);
    msg.className = "msg good"; msg.textContent = `${praise} ${q.after || ""}`;
    sfx.good(); confetti();
    // After a right answer: a "Did you know?" card with more about the state, country, continent, or coin.

    put("answers", uid(), { g: q.g, d: dayOf(), ok: first, lv: q.lv, t: Date.now(), ...(r.mode === "today" ? { dl: 1 } : {}), ...(r.lesson ? { ls: r.lesson } : {}) });

function advance() {

// A lesson's practice spec is one { g, lv, only, opts } or a list of them (review lessons mix several).
const specOf = (p) => (Array.isArray(p) ? pick(p) : p);
async function needData(ls) {
  await Promise.all([...[].concat(ls.p).map((p) => ensureData(p.g)), ls.data ? ensureData(ls.data) : null, ls.s === "read" ? ensureData("sounds") : null]);
}
async function openLesson(id) {
  const [L, ls] = lessonById(id);
  if (!ls) return;
  try { await needData(ls); } catch { toast("That didn’t load. Check the internet."); return; }
  if (L) S.level = L.n;
  S.lesson = { id, i: 0, tapped: new Set(), slides: ls.slides() };
  S.view = "lesson";
  render();
  speakSlide();
}
function speakSlide() {
  const sl = S.lesson.slides[S.lesson.i];

}
async function startLessonRound(id) {
  const [L, ls] = lessonById(id);

  if (L) S.level = L.n;
  S.round = { mode: "lesson", lesson: id, lv: L ? L.n : null, games: Array.isArray(ls.p) ? shuffle(Array.from({ length: LESSON_Q }, (_, i) => ls.p[i % ls.p.length])) : Array(LESSON_Q).fill(ls.p), i: 0, results: [], seen: new Set(), before: tally().earned };
  S.view = "play";

}
// Level challenge: questions from all of the level's lessons; 5 of 6 right on the first try finishes the level.
async function startBoss(n) {
  const L = LEVELS[n - 1];
  try { await Promise.all(L.lessons.map(needData)); } catch { toast("That didn’t load. Check the internet."); return; }
  const specs = shuffle([...L.lessons, ...L.lessons].map((x) => specOf(x.p))).slice(0, BOSS_Q);
  S.level = n;
  S.round = { mode: "boss", lesson: "c" + n, boss: true, lv: n, games: specs, i: 0, results: [], seen: new Set(), before: tally().earned };
  S.view = "play";

}
function finishLesson() {
  // Any lesson (Adventure or library) can finish a level, so compare every level and grade before and after.
  const r = S.round, right = r.results.filter(Boolean).length, wasLv = LEVELS.map((L) => levelDone(L.n)), wasGr = GRADES.map((_, i) => gradeDone(i));
  const old = (S.data.lessons || {})[r.lesson];
  const doc = { ...(r.lv ? { lv: r.lv } : {}), n: Math.max(right, old ? old.n || 0 : 0), of: r.games.length, d: dayOf(), t: Date.now() };
  if (r.boss) doc.pass = right >= BOSS_PASS || !!(old && old.pass);
  put("lessons", r.lesson, doc);
  flush();
  const after = tally();
  const up = LEVELS.find((L, i) => !wasLv[i] && levelDone(L.n)), gi = up ? gradeOf(up.n) : -1;
  r.summary = { right, gained: after.earned - r.before, levelUp: !!up, upLevel: up ? up.n : null, trophy: gi >= 0 && !wasGr[gi] && gradeDone(gi), first: !old, pass: r.boss ? right >= BOSS_PASS : null };
  S.view = r.summary.levelUp ? "levelup" : "lessondone";
  render();
  if (r.summary.levelUp) {
    tone([523, 659, 784, 1047, 1319, 1568], 0.18, "triangle", 0.11, 0.14); confetti(140);
    const L = LEVELS[r.summary.upLevel - 1], g = GRADES[gradeOf(L.n)];
    say(`Level up! You finished level ${L.n}, ${L.name}!${r.summary.trophy ? ` You won the ${g.tname}!` : ""} You earned ${plural(r.summary.gained, "star", "stars")}!`, 500, "praise");
  } else {
    sfx.win(); confetti(60);
    say(r.boss ? (r.summary.pass ? "You passed the challenge!" : `You got ${right} right. You need ${BOSS_PASS} to pass. Try the lessons, then try again!`)

  }
}

function mapView(t) {
  const cur = currentLevel(), XS = [50, 76, 50, 24], items = [], pts = [];

  GRADES.forEach((g, gi) => {
    items.push(`<div class="gband" style="top:${y}px">${g.name}</div>`);

      const x = XS[k++ % 4], done = levelDone(L.n), open = L.lessons && unlocked(L.n);
      const cls = done ? "done" : !L.lessons ? "soon" : open ? (L.n === cur ? "cur" : "open") : "lock";
      const got = L.lessons ? L.lessons.filter((ls) => lsDone(ls)).length : 0;
      items.push(`<button class="node ${cls}" style="left:${x}%;top:${y}px" data-level="${L.n}" aria-label="Level ${L.n}: ${esc(L.name)}">
        <span class="nem">${!L.lessons || open || done ? L.em : "🔒"}</span><b>${L.n}</b>${L.n === cur && !done ? `<span class="me">🦖</span>` : ""}

    pts.push([50, y - 26]);

  // Smooth trail through every stop (Catmull-Rom curve as Bézier pieces).

  <h2>🗺️ My adventure</h2>

    ${items.join("")}
  </div>
  <div class="rows"><button class="row" data-go="grownups"><span class="ico">🔒</span><span class="txt"><b>Grown-ups</b><small>For ${PARENT_NAME}</small></span></button></div>`;
}

  if (give) {
    const id = give.dataset.give || give.dataset.cancel, x = S.data.redemptions[id];
    if (await putNow("redemptions", id, { ...x, status: give.dataset.give ? "delivered" : "cancelled", done: Date.now() })) render();
    return;
  }
  const uf = e.target.closest("[data-unfreeze]");
  if (uf && await putNow("freezes", uf.dataset.unfreeze, { ...S.data.freezes[uf.dataset.unfreeze], removed: true })) render();
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "grantForm") {
    if (await putNow("grants", "g-" + uid(), { stars: Math.round(+f.get("stars")), reason: String(f.get("reason")).trim(), t: Date.now() })) { toast("Stars given ⭐"); render(); }
  }
  if (e.target.id === "freezeForm") {
    const from = f.get("from"), to = f.get("to");
    if (to < from) { toast("The end date is before the start."); return; }
    if (await putNow("freezes", "f-" + uid(), { from, to, reason: String(f.get("reason") || "").trim(), t: Date.now() })) { toast("Streak frozen ❄️"); render(); }
  }
});
$("#homeBtn").addEventListener("click", () => {
  if (S.view === "play" && S.round.mode === "today" && S.round.results.length) { modal(`<span class="em">🛑</span><h2>Stop Today's 5?</h2>`, () => { S.view = "home"; S.round = null; render(); }); return; }
  S.view = "home"; S.round = null; render();
});
$("#soundBtn").addEventListener("click", () => {
  S.sound = !S.sound;
  try { localStorage.setItem("hgt-sound", S.sound ? "on" : "off"); } catch { /* storage blocked */ }
  if (!S.sound && "speechSynthesis" in window) speechSynthesis.cancel();
  render();
  if (S.view === "play" && S.round) { /* keep the question on screen */ }
});
// Pick up changes from the other phone (prize given, stars from Papa) when the app comes back, between rounds only.
let lastLoad = Date.now();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || S.view === "play" || !S.api || Date.now() - lastLoad < 60000 || queue.length) return;
  try { const j = await load(); S.data = j.data; lastLoad = Date.now(); render(); } catch { /* keep what we have */ }
});

// ---------- Day / Night ----------
// Auto follows the iPad's setting; saved on each device, and the <head> script applies it before the page shows.
const THEMES = [["auto", "🌗", "Auto: like the iPad"], ["light", "☀️", "Day mode"], ["dark", "🌙", "Night mode"]];
let theme = THEMES.some((x) => x[0] === document.documentElement.dataset.theme) ? document.documentElement.dataset.theme : "auto";
function paintTheme() { const t = THEMES.find((x) => x[0] === theme); $("#themeBtn").textContent = t[1]; $("#themeBtn").setAttribute("aria-label", t[2]); }
$("#themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.findIndex((x) => x[0] === theme) + 1) % THEMES.length][0];
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  try { if (theme === "auto") localStorage.removeItem("hgt-theme"); else localStorage.setItem("hgt-theme", theme); } catch { /* works until the page closes */ }
  paintTheme();
  toast(THEMES.find((x) => x[0] === theme)[2]);
});
paintTheme();

// ---------- iPhone and iPad gestures ----------
// The home-screen app has no back swipe or pull-to-refresh of its own, so the app adds them.
// Swipe from the left edge: back one screen (not during a game; the ✕ button does that). Swipe sideways on a story: turn the page.
// Pull down at the top: refresh (not during a game). In Safari, its own back swipe goes back one screen.
const BACK = { done: "home", rewards: "home", grownups: "home", voices: "grownups", stories: "home", story: "stories", games: "home", trophies: "home", level: "home", lesson: "level", lessondone: "level", levelup: "home", topic: "games", placed: "home", flash: "flashmenu", flashmenu: "games" };
const EDGE = 28;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function goBack() {
  let to = BACK[S.view];
  if (!to) return false;
  if ((S.view === "lesson" || S.view === "lessondone") && S.ctx && S.ctx.type === "topic") to = "topic";
  if (S.view === "done" || S.view === "lessondone" || S.view === "levelup") S.round = null;
  S.view = to; render();
  return true;
}
addEventListener("popstate", () => {
  if (S.view === "home") return;
  if (S.view === "play") { try { history.pushState({ hgt: 1 }, ""); } catch { /* limited */ } $("#homeBtn").click(); return; }
  goBack();
});
function turnPage(dir) {
  const st = R().stories.find((x) => x.id === S.story.id), i = S.story.page + dir;
  const b = document.querySelector(`.storynav [data-sp="${i}"]`);
  if (b && !b.disabled) { b.click(); return true; }
  if (dir < 0 && S.story.page >= st.pages.length) { S.story.page = i; render(); return true; }
  return false;
}
async function refreshApp() {
  await flush();
  for (let i = 0; (flushing || queue.length) && i < 50; i++) await new Promise((r) => setTimeout(r, 100));
  location.reload();
}
const ptr = document.createElement("div");
ptr.className = "ptr"; ptr.setAttribute("aria-hidden", "true"); ptr.innerHTML = "<span>🔄</span>";
document.body.append(ptr);
const mainEl = $("#app");
function settle(el, css) { el.style.transition = "transform .18s ease-out, opacity .18s ease-out"; Object.assign(el.style, css); setTimeout(() => { el.style.transition = ""; }, 200); }
let g = null;
document.addEventListener("touchstart", (e) => {
  g = null;
  if (e.touches.length !== 1 || e.target.closest("input, textarea, select, .modal")) return;
  const t = e.touches[0];
  g = {
    x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, dy: 0,
    back: isIOS() && standalone() && t.clientX < EDGE && !!BACK[S.view],
    page: S.view === "story" && t.clientX >= EDGE,
    pull: standalone() && navigator.maxTouchPoints > 0 && window.scrollY <= 0 && S.view !== "play"
  };
}, { passive: true });
document.addEventListener("touchmove", (e) => {
  if (!g) return;
  const t = e.touches[0];
  g.dx = t.clientX - g.x0; g.dy = t.clientY - g.y0;
  if (!g.lock) {
    if (Math.abs(g.dx) < 10 && Math.abs(g.dy) < 10) return;
    g.lock = Math.abs(g.dx) > Math.abs(g.dy) ? (g.back ? "back" : g.page ? "page" : "none") : g.pull && g.dy > 0 ? "pull" : "none";
    if (g.lock === "back" || g.lock === "page") mainEl.classList.add("swiping");
  }
  if (g.lock === "back") { e.preventDefault(); mainEl.style.transform = `translateX(${Math.max(0, g.dx)}px)`; }
  else if (g.lock === "page") mainEl.style.transform = `translateX(${g.dx * 0.35}px)`;
  else if (g.lock === "pull") {
    const d = Math.min(Math.max(0, g.dy) * 0.5, 80);
    ptr.style.opacity = String(Math.min(1, d / 60)); ptr.style.transform = `translateY(${d}px) rotate(${d * 4}deg)`; ptr.classList.toggle("ready", d >= 60);
  }
}, { passive: false });
function endGesture(cancel) {
  if (!g) return;
  const { lock, dx, dy, t0 } = g, fast = Date.now() - t0 < 250;
  g = null;
  mainEl.classList.remove("swiping");
  if (lock === "back") {
    if (!cancel && (dx > 90 || (dx > 40 && fast))) {
      settle(mainEl, { transform: `translateX(${innerWidth}px)` });
      setTimeout(() => { goBack(); requestAnimationFrame(() => { mainEl.style.transition = ""; mainEl.style.transform = ""; }); }, 160);
    } else settle(mainEl, { transform: "" });
  } else if (lock === "page") {
    if (!cancel && Math.abs(dx) > 70 && turnPage(dx < 0 ? 1 : -1)) mainEl.style.transform = ""; else settle(mainEl, { transform: "" });
  } else if (lock === "pull") {
    if (!cancel && Math.min(Math.max(0, dy) * 0.5, 80) >= 60) { ptr.classList.add("spin"); settle(ptr, { transform: "translateY(60px)" }); refreshApp(); }
    else { settle(ptr, { opacity: "0", transform: "" }); ptr.classList.remove("ready"); }
  }
}
document.addEventListener("touchend", () => endGesture(false));
document.addEventListener("touchcancel", () => endGesture(true));

(async function boot() {
  try {
    const j = await load();
    Object.assign(S, { role: j.role, space: j.space, data: j.data || {} });
    for (const c of ["answers", "days", "redemptions", "grants", "freezes", "lessons", "cards"]) S.data[c] ||= {};
    render();
    loadClipIndex();
    if (S.api) { ensureData("states").catch(() => {}); ensureData("countries").catch(() => {}); ensureData("sounds").catch(() => {}); }
  } catch {
    $("#app").innerHTML = `<p class="loading">Couldn’t connect. 📡<br><button class="btn" onclick="location.reload()">Try again</button></p>`;
  }
})();
</script>
