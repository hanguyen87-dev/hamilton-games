<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="theme-color" content="#FFB703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Time">
<title>Game Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root { --bg: #FFF8EC; --surface: #FFFFFF; --line: #F0DFC0; --ink: #2B2118; --muted: #7A6A58; --brand: #F77F00; --brand-ink: #FFFFFF; --sun: #FFB703; --bad: #CF3E36; --f: "Baloo 2", ui-rounded, system-ui, sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --bad: #FF8178; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1B1712; --surface: #272019; --line: #43392D; --ink: #FBF3E6; --muted: #C2B19B; --brand: #FFA436; --brand-ink: #1B1712; --bad: #FF8178; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 18px/1.45 var(--f); min-height: 100vh; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.wrap { width: 100%; max-width: 400px; display: grid; gap: 18px; }
.hero { text-align: center; }
.hero .em { font-size: 3.6rem; line-height: 1; letter-spacing: .1em; }
h1 { font-size: clamp(2.2rem, 9vw, 2.8rem); font-weight: 800; line-height: 1.05; margin: 8px 0 4px; }
.hero p { margin: 0; color: var(--muted); }
form { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 16px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
legend { font-weight: 800; margin-bottom: 8px; padding: 0; }
.who { position: relative; }
.who input { position: absolute; opacity: 0; }
.who span { display: grid; place-items: center; text-align: center; padding: 12px 6px; border: 2px solid var(--line); border-radius: 16px; font-weight: 800; cursor: pointer; line-height: 1.2; }
.who span i { font-style: normal; font-size: 2rem; display: block; }
.who input:checked + span { border-color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); color: var(--brand); }
.who input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
label.f { display: grid; gap: 6px; font-weight: 800; }
input[type=password] { font: inherit; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
button { font: inherit; font-weight: 800; font-size: 1.25rem; border: 0; border-radius: 16px; padding: 12px; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--bad); font-weight: 700; margin: 0; min-height: 1.4em; }
.test { justify-self: end; font-size: .85rem; color: var(--muted); background: none; padding: 0; font-weight: 500; text-decoration: underline; }
.mode { text-align: center; margin: 0; font-weight: 800; color: var(--brand); }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero"><div class="em">🍎⏰🗺️</div><h1>Hamilton’s Game Time</h1><p>Counting, coins, clocks, states, flags, and countries.</p></section>
  <form id="f" novalidate>
    <p class="mode" id="testNote" hidden>🧪 Test mode (parent password)</p>
    <fieldset id="whoSet">
      <legend>Who’s playing?</legend>
      <label class="who"><input type="radio" name="role" value="student" checked><span><i>🦖</i>Hamilton</span></label>
      <label class="who"><input type="radio" name="role" value="parent"><span><i>👨</i>Parent</span></label>
    </fieldset>
    <label class="f">Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button id="go">Let’s play!</button>
    <button type="button" class="test" id="testBtn">Test mode</button>
  </form>
</main>
<script>
"use strict";
let tester = false;
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
document.getElementById("testBtn").addEventListener("click", () => {
  tester = !tester;
  document.getElementById("testNote").hidden = !tester;
  document.getElementById("whoSet").hidden = tester;
  document.getElementById("testBtn").textContent = tester ? "Back to normal login" : "Test mode";
});
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const password = document.getElementById("pw").value;
  if (!password) { err.textContent = "Type the password."; return; }
  const role = tester ? "tester" : new FormData(f).get("role");
  go.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ role, password }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    err.textContent = j.error || "That didn’t work. Try again.";
  } catch { err.textContent = "No internet. Try again."; }
  go.disabled = false;
});
</script>
</body>
</html>
